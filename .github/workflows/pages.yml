name: Deploy strategy page

# Builds web/data/strategy.json from the Python strategy model and publishes
# web/ to GitHub Pages. One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_web_data.py"
      - "src/strategy_analyzer.py"
      - "src/simulation/future_race_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build data file
        # Only pandas is needed: the script loads the bundled calendar without
        # importing FastF1.
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          python scripts/build_web_data.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
