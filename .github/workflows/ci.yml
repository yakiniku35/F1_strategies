name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # temp_replay is a stale gitlink with no .gitmodules entry, so asking
          # for submodules here would fail the checkout.
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately not the full requirements.txt: FastF1 and scikit-learn
        # are large and nothing in the suite calls into them. tests/conftest.py
        # stubs whatever is missing, so the pure-logic tests still run.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas matplotlib arcade

      - name: Run tests
        run: pytest -q

  lint:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile every module
        # Cheap guard against syntax errors in files the tests do not import.
        run: python -m compileall -q main.py run_integrated.py src tests
